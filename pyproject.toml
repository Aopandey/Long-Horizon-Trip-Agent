[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trip-agent"
version = "0.1.0"
description = "Long-horizon trip-planning agent for studying misinformation, verification and recovery (CS 5130)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
supabase = ["supabase>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
trip-agent = "trip_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["trip_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: needs a running Ollama server with the configured model (deselect with -m 'not ollama')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]
